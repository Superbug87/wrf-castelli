name: Prova geogrid con quota 30 m e suolo 10 m
# Lancia geogrid due volte (dati di serie e dati fini) su un ramo a scelta e confronta i geo_em. Non tocca le previsioni.
on:
  workflow_dispatch:
    inputs:
      ramo:
        description: "Ramo con wrf/dati_fini.py"
        default: dati-fini
permissions:
  contents: read
env:
  WRF_TAG: v4.7.0
  WPS_TAG: v4.7.0
jobs:
  prova:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ramo }}
      - name: Recupero WRF e WPS compilati
        uses: actions/cache/restore@v5
        with:
          path: /home/runner/wrf-install
          key: wrf-build-${{ env.WRF_TAG }}-${{ env.WPS_TAG }}-${{ hashFiles('wrf/costruisci.sh', 'wrf/dipendenze.sh') }}
          fail-on-cache-miss: true
      - name: Dipendenze di sistema
        run: bash wrf/dipendenze.sh
      - name: geogrid con i dati di serie
        run: |
          DATI_FINI=0 GEO=$HOME/geo-vecchi bash wrf/statico.sh 2>&1 | tail -n 15
      - name: geogrid con i dati fini
        run: |
          DATI_FINI=1 GEO=$HOME/geo-nuovi bash wrf/statico.sh 2>&1 | tail -n 40
      - name: Confronto
        run: |
          python3 -m pip install --quiet netCDF4 matplotlib numpy
          python3 wrf/confronta_geo.py $HOME/geo-vecchi $HOME/geo-nuovi $HOME/confronto
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: confronto-geo
          path: |
            /home/runner/confronto
            /home/runner/geo-nuovi
            /home/runner/lavoro-geogrid/geogrid.log
